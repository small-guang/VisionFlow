name: alog-standalone

services:
  alog:
    build:
      context: .
      dockerfile: Dockerfile-ALog
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-registry.cn-hangzhou.aliyuncs.com/eapil/python:3.12-slim-bookworm}
    command: python main.py
    working_dir: /app
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/app
    network_mode: "host"
    ipc: ${ALOG_IPC_MODE:-private}
    restart: unless-stopped
