name: visionflow

services:
  visionflow:
    build:
      context: .
      dockerfile: Dockerfile-ALog
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    working_dir: /app
    env_file:
      - path: .env
        required: false
    volumes:
      - visionflow-logs:/app/logs
    network_mode: "host"
    ipc: ${ALOG_IPC_MODE:-private}
    restart: unless-stopped

volumes:
  visionflow-logs:
